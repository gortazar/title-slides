name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # Nothing ships that has not passed the suite the tag was cut from.
      - run: nix flake check --print-build-logs

      # The artefact is the extension as `quarto add` installs it: unzip it into a
      # project and _extensions/title-slides is in place, no build step anywhere.
      - name: Package the extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          nix build .#default
          mkdir -p dist
          cp -rL result/_extensions dist/_extensions
          (cd dist && zip -r "../title-slides-$version.zip" _extensions)
          unzip -l "title-slides-$version.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(printf '%s\n' \
            "Install with:" \
            "" \
            "    quarto add gortazar/title-slides@$GITHUB_REF_NAME" \
            "" \
            "Then switch it on in the document, with \`filters: [title-slides]\` and" \
            "\`title-slides: true\` in the frontmatter." \
            "" \
            "The attached zip is the same extension for unzipping straight into a" \
            "project, which puts \`_extensions/title-slides\` in place.")"
          gh release create "$GITHUB_REF_NAME" \
            --title "title-slides $GITHUB_REF_NAME" \
            --notes "$notes" \
            "title-slides-$version.zip"
